     <main class="catering-container">
    <section class="catering-title"><h1>Catering</h1>
    <p>We offer dessert bars, milk tea stations, and custom catering packages for events of all sizes.</p></section>
<section class="catering-search">
    <h2>Enquiry Form</h2>

    <form class="enquiry-form">
      <label>Name</label>
      <input type="text" name="name" placeholder="Your full name" required>

      <label>Email</label>
      <input type="email" name="email" placeholder="you@example.com" required>

      <label>Phone Number</label>
      <input type="text" name="phone" placeholder="e.g. 021 123 4567" required>

      <label>Event Type</label>
      <select name="event-type" required>
        <option value="">Select an event</option>
        <option>Birthday</option>
        <option>Wedding</option>
        <option>Corporate Event</option>
        <option>Private Party</option>
        <option>Other</option>
      </select>

      <label>Event Date</label>
      <input type="date" name="date" required>

      <label>Number of Guests</label>
      <input type="number" name="guests" placeholder="e.g. 50" required>

      <label>Message / Special Requests</label>
      <textarea name="message" rows="5" placeholder="Tell us about your event..."></textarea>

      <button type="submit">Submit Enquiry</button>
    </form>
</section>
  </main>
